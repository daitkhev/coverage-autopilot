name: frozen

# GitHub takes this file from the default branch, whatever the pull request
# holds. The job runs the default branch only and never the change.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions: {}

concurrency:
  group: frozen-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frozen:
    name: frozen
    # The promotion of dev carries changes that were judged one by one.
    if: >-
      !(github.head_ref == 'dev' && github.base_ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # the default branch, which holds the check
      pull-requests: read # the list of the files of the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: list the files of the pull request
        run: >-
          gh api --paginate
          "repos/$REPOSITORY/pulls/$NUMBER/files?per_page=100"
          --jq '.[] | {filename, previous_filename} | tojson'
          > "$RUNNER_TEMP/files.jsonl"
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
      - run: node harness/bin/guard.ts "$RUNNER_TEMP/files.jsonl" "$CHANGED"
        env:
          CHANGED: ${{ github.event.pull_request.changed_files }}
